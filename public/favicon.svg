<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow filter for Hanzi character -->
    <filter id="charShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4c0519" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75" />

  <!-- Mizige subtle calligraphy grid watermark -->
  <g opacity="0.14" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6">
    <line x1="86" y1="236" x2="426" y2="236" />
    <line x1="256" y1="66" x2="256" y2="406" />
    <line x1="120" y1="100" x2="392" y2="372" stroke-dasharray="4 8" />
    <line x1="392" y1="100" x2="120" y2="372" stroke-dasharray="4 8" />
  </g>

  <!-- Centered Hanzi Character '汉' in Pure White -->
  <g filter="url(#charShadow)" transform="translate(256, 236) scale(0.35, -0.35) translate(-543.5, -399.5)">
    <path d="M 256 721 Q 281 699 309 673 Q 325 658 343 660 Q 355 661 360 676 Q 364 694 354 727 Q 342 758 249 775 Q 231 779 224 775 Q 218 771 221 756 Q 225 743 256 721 Z" fill="#ffffff"/>
    <path d="M 140 542 Q 195 482 229 469 Q 245 466 255 481 Q 261 494 258 512 Q 246 557 155 583 Q 154 584 153 584 Q 135 588 125 585 Q 118 584 122 570 Q 123 557 140 542 Z" fill="#ffffff"/>
    <path d="M 144 150 Q 131 146 134 127 Q 146 49 186 27 Q 193 20 204 23 Q 213 24 213 51 Q 220 105 337 394 Q 344 410 343 418 Q 342 428 333 421 Q 321 414 309 395 Q 246 292 191 199 Q 176 174 144 150 Z" fill="#ffffff"/>
    <path d="M 544 273 Q 471 174 299 75 Q 283 65 292 60 Q 299 57 325 67 Q 439 109 510 159 Q 544 184 577 225 L 611 271 Q 621 289 634 307 Q 691 395 725 521 Q 737 569 771 600 Q 792 619 773 634 Q 748 650 715 658 Q 685 668 657 652 Q 617 639 547 620 Q 468 607 387 602 Q 368 602 363 596 Q 359 583 383 567 Q 413 546 482 568 Q 635 611 652 606 Q 665 606 666 582 Q 638 426 572 313 L 544 273 Z" fill="#ffffff"/>
    <path d="M 577 225 Q 628 158 691 87 Q 710 62 742 59 Q 842 46 926 49 Q 969 50 967 62 Q 964 71 769 151 Q 690 193 611 271 L 572 313 Q 526 365 478 429 Q 444 477 405 481 Q 386 484 381 479 Q 378 472 394 458 Q 448 416 544 273 L 577 225 Z" fill="#ffffff"/>
  </g>

  <!-- Bottom Gold Badge for HSK Free Lab -->
  <g transform="translate(256, 436)">
    <rect x="-80" y="-18" width="160" height="34" rx="17" fill="#1c1917" opacity="0.9" />
    <rect x="-80" y="-18" width="160" height="34" rx="17" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="2" text-anchor="middle" dominant-baseline="central" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="3">HSK FREE</text>
  </g>

  <!-- Top Right Sparkle Star -->
  <path d="M 405 85 Q 405 101 421 101 Q 405 101 405 117 Q 405 101 389 101 Q 405 101 405 85 Z" fill="#fef08a" opacity="0.95" />
</svg>
